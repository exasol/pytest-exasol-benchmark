# Sketches only: this file is intentionally outside .github/workflows.
#
# The three YAML documents are separate workflow files:
#   1. benchmark-run.yml: consumer-controlled benchmark execution;
#   2. benchmark-parent.yml: consumer-controlled composition and configuration;
#   3. benchmark-orchestrator.yml: a checked-in, repository-owned reusable
#      artifact orchestration workflow.
#
# The orchestrator is not generated by a production Nox session. A consumer
# checks it into its repository (or maintains its own reusable workflow based
# on this sketch). The package's benchmark:generate-example session generates
# this file only inside the deterministic example-consumer fixture.
#
# Existing package CLIs are called directly. Nox is reserved for operations
# without a package CLI: provenance, base freshness, and guarded Git updates.

# --- benchmark-run.yml -------------------------------------------------------

name: benchmark-run

on:
  workflow_call:
    inputs:
      matrix_json:
        required: true
        type: string
    outputs:
      artifact-run-id:
        description: Run identifier containing uploaded runner artifacts.
        value: ${{ jobs.benchmark.outputs.run_id }}
      recorded-base-sha:
        description: PR base SHA captured when benchmark execution started.
        value: ${{ jobs.benchmark.outputs.base_sha }}

jobs:
  benchmark:
    name: benchmark (${{ matrix.runner }})
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ github.run_id }}
      base_sha: ${{ github.event.pull_request.base.sha }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark project
        run: pip install .
      # Consumer-specific database/data setup belongs here.
      - name: Run benchmarks
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark"
          pytest tests/benchmarks \
            --benchmark-json="$RUNNER_TEMP/benchmark/output.json"
      - name: Generate benchmark provenance
        run: >-
          python -m nox -s benchmark:provenance --
          --output "$RUNNER_TEMP/benchmark/provenance.json"
          --base-revision "${{ github.event.pull_request.base.sha }}"
      # A failed pytest run must not become a candidate artifact.
      - name: Package runner artifact
        run: |
          pytest-exasol-benchmark package \
            --benchmark-json "$RUNNER_TEMP/benchmark/output.json" \
            --test-set-id tpch-sf10 \
            --comparison-target onprem-standard \
            --runner-execution-id "${{ matrix.runner }}" \
            --source-revision "${GITHUB_SHA}" \
            --provenance-json "$RUNNER_TEMP/benchmark/provenance.json" \
            --output-dir "$RUNNER_TEMP/benchmark/artifact"
      - name: Upload runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.runner }}
          path: ${{ runner.temp }}/benchmark/artifact
          if-no-files-found: error

---

# --- benchmark-parent.yml ---------------------------------------------------

name: benchmark-parent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  benchmark-run:
    uses: ./.github/workflows/benchmark-run.yml
    with:
      matrix_json: '{"runner":["runner-1","runner-2","runner-3"]}'
    permissions:
      contents: read

  # The parent passes workflow-level inputs only. It does not inspect artifacts
  # or implement comparison, storage, approval, or Git operations.
  orchestrate:
    needs: benchmark-run
    uses: ./.github/workflows/benchmark-orchestrator.yml
    with:
      artifact-run-id: ${{ needs.benchmark-run.outputs.artifact-run-id }}
      expected-base-sha: ${{ needs.benchmark-run.outputs.recorded-base-sha }}
      history-root: benchmark-history
      threshold: 10
    secrets: inherit
    permissions:
      contents: write
      pull-requests: read

---

# --- checked-in benchmark-orchestrator.yml ----------------------------------

name: benchmark-orchestrator

on:
  workflow_call:
    inputs:
      artifact-run-id:
        required: true
        type: string
      expected-base-sha:
        required: true
        type: string
      history-root:
        required: false
        type: string
        default: benchmark-history
      threshold:
        required: false
        type: number
        default: 10

jobs:
  check-base:
    name: Check benchmark base
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: exasol/python-toolbox/.github/actions/python-environment@v10
        with:
          python-version: "3.12"
          poetry-version: "2.3.0"
      - run: poetry install --no-interaction
      - name: Check recorded pull-request base
        run: >-
          poetry run nox -s benchmark:check-base --
          --expected-base-sha "${{ inputs.expected-base-sha }}"

  compare:
    name: Compare benchmark artifacts
    needs: check-base
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: exasol/python-toolbox/.github/actions/python-environment@v10
        with:
          python-version: "3.12"
          poetry-version: "2.3.0"
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact-run-id }}
          path: artifacts
          github-token: ${{ github.token }}
          merge-multiple: false
      - name: Compare with history
        run: >-
          poetry run pytest-exasol-benchmark compare artifacts
          --history-root "${{ inputs.history-root }}"
          --threshold "${{ inputs.threshold }}"
          --json-report comparison-reports.json
          --text-report comparison-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-comparison-report
          path: |
            comparison-reports.json
            comparison-report.txt
          if-no-files-found: ignore

  store:
    name: Store accepted benchmark baseline
    needs: compare
    runs-on: ubuntu-24.04
    environment: benchmark-baseline-approval
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: exasol/python-toolbox/.github/actions/python-environment@v10
        with:
          python-version: "3.12"
          poetry-version: "2.3.0"
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact-run-id }}
          path: artifacts
          github-token: ${{ github.token }}
          merge-multiple: false
      - name: Store accepted baseline
        run: >-
          poetry run pytest-exasol-benchmark store artifacts
          --history-root "${{ inputs.history-root }}"
      - name: Commit baseline to source branch
        run: >-
          poetry run nox -s benchmark:commit-baseline --
          --history-root "${{ inputs.history-root }}"
          --source-branch "${{ github.event.pull_request.head.ref }}"
          --commit-message "Update benchmark baseline"
